apiVersion: apps/v1
kind: Deployment
metadata:
  name: troubleshooting-web
  namespace: session14-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: troubleshooting-web
  template:
    metadata:
      labels:
        app: troubleshooting-web
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
