apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhruv-devsecops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dhruv-devsecops
  template:
    metadata:
      labels:
        app: dhruv-devsecops
    spec:
      containers:
        - name: web
          image: ghcr.io/dhruvb2028/dhruv-devsecops:latest
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
