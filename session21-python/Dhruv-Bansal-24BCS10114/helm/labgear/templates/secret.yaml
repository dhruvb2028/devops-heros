apiVersion: v1
kind: Secret
metadata:
  name: labgear-db
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.database.password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg://%s:%s@labgear-postgres:5432/%s" .Values.database.user .Values.database.password .Values.database.name | quote }}
