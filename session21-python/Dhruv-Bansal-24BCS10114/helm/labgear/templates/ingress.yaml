{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: labgear
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: labgear-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: labgear-frontend
                port:
                  number: 8080
{{- end }}
