{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: labgear-backend
  labels:
    release: monitoring
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      app: labgear-backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
{{- end }}
