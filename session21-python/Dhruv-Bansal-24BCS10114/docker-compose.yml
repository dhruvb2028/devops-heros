services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: labgear
      POSTGRES_USER: labgear
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labgear -d labgear"]
      interval: 5s
      retries: 10

  labgear-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://labgear:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/labgear
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      retries: 5

  labgear-frontend:
    build: ./frontend
    depends_on:
      labgear-backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres_data:
