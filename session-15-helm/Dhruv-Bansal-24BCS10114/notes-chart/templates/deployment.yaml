apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-notes
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-notes
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-notes
      annotations:
        checksum/page: {{ printf "%s:%s" .Values.app.environment .Values.app.message | sha256sum }}
    spec:
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 80
          volumeMounts:
            - name: page
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: page
          configMap:
            name: {{ .Release.Name }}-page
