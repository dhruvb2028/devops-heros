apiVersion: v1
kind: Pod
metadata:
  name: persistent-storage-demo
  namespace: session13-demo
spec:
  containers:
    - name: tools
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: persistent-data
          mountPath: /data
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: persistent-data
