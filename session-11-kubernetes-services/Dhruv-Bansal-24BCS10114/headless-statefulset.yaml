apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  namespace: session11-demo
spec:
  serviceName: backend-headless
  replicas: 2
  selector:
    matchLabels:
      app: headless-backend
  template:
    metadata:
      labels:
        app: headless-backend
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
