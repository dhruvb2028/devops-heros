apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-blue
  namespace: session10-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-demo
      slot: blue
  template:
    metadata:
      labels:
        app: blue-green-demo
        slot: blue
        version: v1
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
