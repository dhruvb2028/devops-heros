apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-green
  namespace: session10-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blue-green-demo
      slot: green
  template:
    metadata:
      labels:
        app: blue-green-demo
        slot: green
        version: v2
    spec:
      containers:
        - name: nginx
          image: nginx:1.28-alpine
          ports:
            - containerPort: 80
