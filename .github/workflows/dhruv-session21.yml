name: LabGear capstone

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: session21-python/Dhruv-Bansal-24BCS10114
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test API and migration
        run: |
          python -m pip install -r backend/requirements-dev.txt
          cd backend
          python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: session21-python/Dhruv-Bansal-24BCS10114/frontend/package-lock.json
      - name: Test and build frontend
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

  images:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.component }} image
        run: docker build -t ghcr.io/dhruvb2028/labgear-${{ matrix.component }}:${{ github.sha }} session21-python/Dhruv-Bansal-24BCS10114/${{ matrix.component }}
      - name: Scan ${{ matrix.component }} image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/dhruvb2028/labgear-${{ matrix.component }}:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish ${{ matrix.component }} image
        run: docker push ghcr.io/dhruvb2028/labgear-${{ matrix.component }}:${{ github.sha }}

  kind-smoke:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: labgear
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: Build and load images
        run: |
          docker build -t labgear-backend:local session21-python/Dhruv-Bansal-24BCS10114/backend
          docker build -t labgear-frontend:local session21-python/Dhruv-Bansal-24BCS10114/frontend
          kind load docker-image labgear-backend:local labgear-frontend:local --name labgear
      - name: Deploy to temporary cluster
        run: |
          DB_PASSWORD=$(openssl rand -hex 16)
          helm upgrade --install labgear session21-python/Dhruv-Bansal-24BCS10114/helm/labgear \
            --namespace labgear --create-namespace \
            -f session21-python/Dhruv-Bansal-24BCS10114/helm/labgear/values-dev.yaml \
            --set ingress.enabled=false --set hpa.enabled=false \
            --set database.storageSize=1Gi \
            --set-string database.password="$DB_PASSWORD" \
            --wait --timeout 7m
          kubectl get pods,svc,pvc -n labgear
      - name: Check running app
        run: |
          set -euo pipefail
          kubectl port-forward -n labgear svc/labgear-frontend 3000:8080 > "$RUNNER_TEMP/port-forward.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:3000/health
          curl --fail --silent http://localhost:3000/ | grep -q '<div id="root">'
          item=$(curl --fail --silent -X POST http://localhost:3000/api/equipment \
            -H 'Content-Type: application/json' \
            -d '{"name":"Lab microscope","category":"Microscope","location":"Lab A"}')
          item_id=$(echo "$item" | jq -r '.id')
          test "$item_id" != 'null'
          test "$(curl --fail --silent http://localhost:3000/api/equipment/stats | jq -r '.total')" = 1
          curl --fail --silent -X POST "http://localhost:3000/api/equipment/$item_id/checkout" \
            -H 'Content-Type: application/json' \
            -d '{"borrower":"Demo student","due_date":"2030-12-31"}' | jq -e '.status == "checked_out"'
          curl --fail --silent -X POST "http://localhost:3000/api/equipment/$item_id/return" | jq -e '.status == "available"'
          test "$(curl --fail --silent http://localhost:3000/api/equipment/stats | jq -r '.available')" = 1
          kubectl exec -n labgear deployment/labgear-backend -- python -c \
            'import urllib.request; body = urllib.request.urlopen("http://localhost:8000/metrics").read(); assert b"http_requests_total" in body or b"http_request_duration_seconds" in body'
          echo 'Kubernetes smoke test passed'
      - name: Capture live app screenshots
        run: |
          set -euo pipefail
          kubectl port-forward -n labgear svc/labgear-frontend 3000:8080 > "$RUNNER_TEMP/port-forward-screenshots.log" 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --silent --fail http://localhost:3000/health > /dev/null; then break; fi
            sleep 2
          done
          curl --fail --silent -X POST http://localhost:3000/api/equipment \
            -H 'Content-Type: application/json' \
            -d '{"name":"Digital oscilloscope","category":"Electronics","location":"Lab B"}' > /dev/null
          camera=$(curl --fail --silent -X POST http://localhost:3000/api/equipment \
            -H 'Content-Type: application/json' \
            -d '{"name":"Thermal camera","category":"Camera","location":"Lab C"}' | jq -r '.id')
          test "$camera" != 'null'
          mkdir -p "$RUNNER_TEMP/labgear-screenshots"
          npx --yes playwright@1.64.1 install --with-deps chromium
          npx --yes playwright@1.64.1 screenshot --browser chromium --viewport-size '1440,900' \
            --wait-for-timeout 2000 --full-page http://localhost:3000 \
            "$RUNNER_TEMP/labgear-screenshots/catalog.png"
          curl --fail --silent -X POST "http://localhost:3000/api/equipment/$camera/checkout" \
            -H 'Content-Type: application/json' \
            -d '{"borrower":"Demo student","due_date":"2030-12-31"}' > /dev/null
          npx --yes playwright@1.64.1 screenshot --browser chromium --viewport-size '1440,900' \
            --wait-for-timeout 2000 --full-page http://localhost:3000 \
            "$RUNNER_TEMP/labgear-screenshots/checked-out.png"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: labgear-live-screenshots
          path: ${{ runner.temp }}/labgear-screenshots/*.png
          retention-days: 1
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get pods,svc,pvc -n labgear || true
          kubectl describe pods -n labgear || true
          kubectl logs -n labgear deployment/labgear-backend --all-containers --tail=100 || true
          kubectl logs -n labgear deployment/labgear-frontend --all-containers --tail=100 || true

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0
      - name: Configure cluster access
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          test -n "$KUBECONFIG_B64"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
      - name: Install current images
        env:
          KUBECONFIG: ${{ runner.temp }}/kubeconfig
          DB_PASSWORD: ${{ secrets.LABGEAR_DB_PASSWORD }}
        run: |
          test -n "$DB_PASSWORD"
          helm upgrade --install labgear session21-python/Dhruv-Bansal-24BCS10114/helm/labgear \
            --namespace labgear --create-namespace \
            -f session21-python/Dhruv-Bansal-24BCS10114/helm/labgear/values-prod.yaml \
            --set backend.tag="$GITHUB_SHA" --set frontend.tag="$GITHUB_SHA" \
            --set-string database.password="$DB_PASSWORD" --wait --timeout 10m
